---
- name: Provision a Google Cloud VM
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - google.cloud
  vars:
    project_id: "{{ lookup('ansible.builtin.env', 'GCP_PROJECT_ID') }}"
    region: "{{ lookup('ansible.builtin.env', 'GCP_REGION') | default('europe-west3', true) }}"
    zone: "{{ lookup('ansible.builtin.env', 'GCP_ZONE') | default('europe-west3-a', true) }}"
    network_name: "{{ lookup('ansible.builtin.env', 'GCP_NETWORK') | default('gcp-ansible-network', true) }}"
    subnet_name: "{{ lookup('ansible.builtin.env', 'GCP_SUBNET') | default('gcp-ansible-subnet', true) }}"
    firewall_name: "{{ lookup('ansible.builtin.env', 'GCP_FIREWALL') | default('gcp-ansible-allow-ssh', true) }}"
    instance_name: "{{ lookup('ansible.builtin.env', 'GCP_INSTANCE') | default('gcp-ansible-vm', true) }}"
    machine_type: "{{ lookup('ansible.builtin.env', 'GCP_MACHINE_TYPE') | default('e2-micro', true) }}"
    image_project: "{{ lookup('ansible.builtin.env', 'GCP_IMAGE_PROJECT') | default('debian-cloud', true) }}"
    image_family: "{{ lookup('ansible.builtin.env', 'GCP_IMAGE_FAMILY') | default('debian-12', true) }}"

  tasks:
    - name: Validate the project ID
      ansible.builtin.assert:
        that:
          - project_id | length > 0
        fail_msg: "Set GCP_PROJECT_ID before running this playbook."

    - name: Create the VPC network
      google.cloud.gcp_compute_network:
        name: "{{ network_name }}"
        project: "{{ project_id }}"
        auto_create_subnetworks: false
        state: present

    - name: Create the subnet
      google.cloud.gcp_compute_subnetwork:
        name: "{{ subnet_name }}"
        project: "{{ project_id }}"
        region: "{{ region }}"
        network: "{{ network_name }}"
        ip_cidr_range: 10.10.0.0/24
        state: present

    - name: Create the SSH firewall rule
      google.cloud.gcp_compute_firewall:
        name: "{{ firewall_name }}"
        project: "{{ project_id }}"
        network: "{{ network_name }}"
        allowed:
          - ip_protocol: tcp
            ports:
              - "22"
        source_ranges:
          - 0.0.0.0/0
        target_tags:
          - ssh
        state: present

    - name: Create the VM
      google.cloud.gcp_compute_instance:
        name: "{{ instance_name }}"
        project: "{{ project_id }}"
        zone: "{{ zone }}"
        machine_type: "{{ machine_type }}"
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: "projects/{{ image_project }}/global/images/family/{{ image_family }}"
              disk_size_gb: 10
              disk_type: pd-balanced
        network_interfaces:
          - network: "{{ network_name }}"
            subnetwork: "{{ subnet_name }}"
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        tags:
          items:
            - ssh
        state: present
      register: created_instance

    - name: Display the VM address
      ansible.builtin.debug:
        msg: "VM {{ instance_name }} is ready. Public IP: {{ created_instance.networkInterfaces[0].accessConfigs[0].natIP | default('not available') }}"

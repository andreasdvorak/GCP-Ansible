---
- name: Validate the project ID
  ansible.builtin.assert:
    that:
      - gcp_vm_project_id | length > 0
    fail_msg: "Set GCP_PROJECT_ID before running this role."

- name: Validate the operating system
  ansible.builtin.assert:
    that:
      - gcp_vm_os in ['linux', 'windows']
    fail_msg: "gcp_vm_os must be either 'linux' or 'windows'."

- name: Create the operating system specific VM
  ansible.builtin.include_tasks: "{{ gcp_vm_os }}.yml"

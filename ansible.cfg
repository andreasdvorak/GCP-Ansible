[defaults]
collections_path = ./collections
deprecation_warnings = False
host_key_checking = False
inventory = inventory/hosts_runtime.ini
roles_path = ./roles_galaxy:./roles
timeout = 60
vault_password_file = .vault_pass
# One fork per host, so all hosts of the inventory run in one pass instead of
# in batches of 5 (the default). Raise it when the inventory grows.
forks = 20
# Shows the duration per task and the total runtime at the end of every run.
# Needed to tell a slow task from a slow host when a run takes too long.
callbacks_enabled = profile_tasks, timer

[privilege_escalation]
become_timeout = 60

[ssh_connection]
# Sends the module straight over the ssh connection instead of copying it to a
# temp directory first. Saves roughly two thirds of the round trips per task,
# which is what dominates the runtime of the loops in the role user.
# Safe on our hosts, none of them has requiretty in sudoers.
pipelining = True
# Reuse one ssh connection per host for the whole run (the default drops it
# after 60s, which means a new handshake in the middle of a long play).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=600s